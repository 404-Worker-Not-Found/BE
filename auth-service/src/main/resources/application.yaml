spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATASOURCE_URL}
    username: ${AUTH_DATASOURCE_USERNAME}
    password: ${AUTH_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${AUTH_REDIS_HOST:localhost}
      port: ${AUTH_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${AUTH_JPA_DDL_AUTO:none}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${AUTH_MAIL_USERNAME:}
    password: ${AUTH_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${AUTH_SERVICE_PORT:8081}

auth:
  verification:
    delivery:
      email-username: ${AUTH_MAIL_USERNAME:}
      email-password: ${AUTH_MAIL_PASSWORD:}
      solapi-api-key: ${AUTH_SOLAPI_API_KEY:}
      solapi-api-secret: ${AUTH_SOLAPI_API_SECRET:}
      sms-from: ${AUTH_VERIFICATION_SMS_FROM:}
  jwt:
    secret: ${AUTH_JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 14d
  member-service:
    base-url: ${MEMBER_SERVICE_BASE_URL}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  oauth2:
    connect-timeout: 3s
    read-timeout: 5s
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_OAUTH_CLIENT_ID:}
      client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
