spring:
  application:
    name: work-service
  datasource:
    url: ${WORK_DATASOURCE_URL}
    username: ${WORK_DATASOURCE_USERNAME}
    password: ${WORK_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${MATCHING_REDIS_HOST:localhost}
      port: ${MATCHING_REDIS_PORT:6381}
      timeout: 2s
      connect-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
work:
  attendance:
    policy-type: ${WORK_ATTENDANCE_POLICY_TYPE:gps}
    radius-meters: ${WORK_CHECK_IN_RADIUS_METERS:100}
    early-window: ${WORK_CHECK_IN_EARLY_WINDOW:30m}
    late-window: ${WORK_CHECK_IN_LATE_WINDOW:30m}
    time-zone: ${WORK_ATTENDANCE_TIME_ZONE:Asia/Seoul}
    completion-role: ${WORK_COMPLETION_ROLE:OWNER}
    allow-early-completion: ${WORK_ALLOW_EARLY_COMPLETION:false}
  jwt:
    secret: ${AUTH_JWT_SECRET}
  events:
    enabled: ${WORK_EVENTS_ENABLED:true}
    stream: ${MATCHING_OUTBOX_STREAM_KEY:matching:domain-events}
  internal:
    secret: ${INTERNAL_API_SECRET}
server:
  port: ${WORK_SERVICE_PORT:8086}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
