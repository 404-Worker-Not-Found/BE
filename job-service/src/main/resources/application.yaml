spring:
  application:
    name: job-service

  datasource:
    url: ${JOB_DATASOURCE_URL}
    username: ${JOB_DATASOURCE_USERNAME}
    password: ${JOB_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JOB_JPA_DDL_AUTO:none}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

job:
  application-admission:
    ttl: ${APPLICATION_ADMISSION_TTL:5m}
  matching-seat-reservation:
    ttl: ${MATCHING_SEAT_RESERVATION_TTL:10m}
    expiry-sweep-enabled: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_ENABLED:true}
    expiry-sweep-interval: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_INTERVAL:1m}
    expiry-sweep-batch-size: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_BATCH_SIZE:100}
  internal:
    secret: ${INTERNAL_API_SECRET}

server:
  port: ${JOB_SERVICE_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
