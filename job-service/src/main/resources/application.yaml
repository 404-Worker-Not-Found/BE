spring:
  application:
    name: job-service

  datasource:
    url: ${JOB_DATASOURCE_URL}
    username: ${JOB_DATASOURCE_USERNAME}
    password: ${JOB_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JOB_JPA_DDL_AUTO:none}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

job:
  application-admission:
    ttl: ${APPLICATION_ADMISSION_TTL:5m}
  matching-seat-reservation:
    ttl: ${MATCHING_SEAT_RESERVATION_TTL:10m}
    expiry-sweep-enabled: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_ENABLED:true}
    expiry-sweep-interval: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_INTERVAL:1m}
    expiry-sweep-batch-size: ${MATCHING_SEAT_RESERVATION_EXPIRY_SWEEP_BATCH_SIZE:100}
  internal:
    secret: ${INTERNAL_API_SECRET}
  recruitment-completion:
    dispatch-enabled: ${RECRUITMENT_COMPLETION_DISPATCH_ENABLED:true}
    dispatch-after-commit: ${RECRUITMENT_COMPLETION_DISPATCH_AFTER_COMMIT:true}
    dispatch-interval: ${RECRUITMENT_COMPLETION_DISPATCH_INTERVAL:5s}
    batch-size: ${RECRUITMENT_COMPLETION_DISPATCH_BATCH_SIZE:50}
    lease-duration: ${RECRUITMENT_COMPLETION_LEASE_DURATION:30s}
    retry-base-delay: ${RECRUITMENT_COMPLETION_RETRY_BASE_DELAY:2s}
    retry-max-delay: ${RECRUITMENT_COMPLETION_RETRY_MAX_DELAY:5m}
    reconcile:
      enabled: ${RECRUITMENT_COMPLETION_RECONCILE_ENABLED:true}
      interval: ${RECRUITMENT_COMPLETION_RECONCILE_INTERVAL:10m}
      initial-delay: ${RECRUITMENT_COMPLETION_RECONCILE_INITIAL_DELAY:30s}
      batch-size: ${RECRUITMENT_COMPLETION_RECONCILE_BATCH_SIZE:100}
  schedule-transition:
    enabled: ${JOB_SCHEDULE_TRANSITION_ENABLED:true}
    interval: ${JOB_SCHEDULE_TRANSITION_INTERVAL:1m}
    initial-delay: ${JOB_SCHEDULE_TRANSITION_INITIAL_DELAY:30s}
    batch-size: ${JOB_SCHEDULE_TRANSITION_BATCH_SIZE:100}
  matching-service:
    base-url: ${MATCHING_SERVICE_BASE_URL:http://localhost:8084}
    connect-timeout: ${MATCHING_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${MATCHING_SERVICE_READ_TIMEOUT:5s}
    call-timeout: ${MATCHING_SERVICE_CALL_TIMEOUT:8s}
  payment-order:
    dispatch-enabled: ${PAYMENT_ORDER_DISPATCH_ENABLED:true}
    dispatch-after-commit: ${PAYMENT_ORDER_DISPATCH_AFTER_COMMIT:true}
    dispatch-interval: ${PAYMENT_ORDER_DISPATCH_INTERVAL:5s}
    batch-size: ${PAYMENT_ORDER_DISPATCH_BATCH_SIZE:50}
    lease-duration: ${PAYMENT_ORDER_LEASE_DURATION:30s}
    retry-base-delay: ${PAYMENT_ORDER_RETRY_BASE_DELAY:2s}
    retry-max-delay: ${PAYMENT_ORDER_RETRY_MAX_DELAY:5m}
  payment-service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
    connect-timeout: ${PAYMENT_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PAYMENT_SERVICE_READ_TIMEOUT:5s}
    call-timeout: ${PAYMENT_SERVICE_CALL_TIMEOUT:8s}

server:
  port: ${JOB_SERVICE_PORT:8083}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
