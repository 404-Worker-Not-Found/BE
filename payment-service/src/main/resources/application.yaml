spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATASOURCE_URL}
    username: ${PAYMENT_DATASOURCE_USERNAME}
    password: ${PAYMENT_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 근무·매칭 이벤트 Stream은 발행 서비스와 같은 matching Redis를 쓴다.
      host: ${MATCHING_REDIS_HOST:localhost}
      port: ${MATCHING_REDIS_PORT:6381}
      timeout: 2s
      connect-timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
payment:
  work-termination:
    enabled: ${PAYMENT_WORK_TERMINATION_ENABLED:true}
  jwt:
    secret: ${AUTH_JWT_SECRET}
  toss:
    enabled: ${TOSS_ENABLED:false}
    secret-key: ${TOSS_SECRET_KEY:}
    # 로컬 PG 대역 서버로 프로세스 간 연동을 확인할 때만 loopback HTTP 주소로 바꾼다.
    api-base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
  job-service:
    base-url: ${JOB_SERVICE_BASE_URL:http://localhost:8083}
  settlement:
    # 근무 완료 후 자동 지급 요청이 가능해질 때까지의 대기 기간
    payout-delay: ${PAYMENT_SETTLEMENT_PAYOUT_DELAY:24h}
  settlement-events:
    # MatchConfirmed로 정산 대상을 기록하고 WorkCompleted로 정산을 예약한다. 두 소비자를 함께 켜고 끈다.
    enabled: ${PAYMENT_SETTLEMENT_EVENTS_ENABLED:true}
    matching-stream: ${MATCHING_OUTBOX_STREAM_KEY:matching:domain-events}
    work-stream: ${WORK_OUTBOX_STREAM_KEY:work:domain-events}
    poll-interval: ${PAYMENT_SETTLEMENT_EVENTS_POLL_INTERVAL:1s}
    initial-delay: ${PAYMENT_SETTLEMENT_EVENTS_INITIAL_DELAY:0s}
    batch-size: ${PAYMENT_SETTLEMENT_EVENTS_BATCH_SIZE:100}
  funding-incidents:
    enabled: ${PAYMENT_FUNDING_INCIDENTS_ENABLED:true}
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8088}
  payout:
    # 실제 지급 어댑터·수취인 등록이 연결되기 전에는 켜지 않는다. 운영 성공 대역은 제공하지 않는다.
    enabled: ${PAYMENT_PAYOUT_ENABLED:false}
    schedule-zone: ${WORK_ATTENDANCE_TIME_ZONE:Asia/Seoul}
    lease-duration: ${PAYMENT_PAYOUT_LEASE_DURATION:1m}
    preparation-retry-delay: ${PAYMENT_PAYOUT_PREPARATION_RETRY_DELAY:5m}
  recovery:
    enabled: true
    interval: 30s
  internal:
    secret: ${INTERNAL_API_SECRET}
server:
  port: ${PAYMENT_SERVICE_PORT:8085}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
