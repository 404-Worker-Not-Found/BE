services:
  auth-mysql:
    image: mysql:8.4
    container_name: wnf-auth-mysql
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_USER: ${AUTH_DB_USERNAME}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  member-mysql:
    image: mysql:8.4
    container_name: wnf-member-mysql
    environment:
      MYSQL_DATABASE: ${MEMBER_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${MEMBER_DB_ROOT_PASSWORD}
      MYSQL_USER: ${MEMBER_DB_USERNAME}
      MYSQL_PASSWORD: ${MEMBER_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - member-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  job-mysql:
    image: mysql:8.4
    container_name: wnf-job-mysql
    environment:
      MYSQL_DATABASE: ${JOB_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${JOB_DB_ROOT_PASSWORD}
      MYSQL_USER: ${JOB_DB_USERNAME}
      MYSQL_PASSWORD: ${JOB_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3309:3306"
    volumes:
      - job-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  matching-mysql:
    image: mysql:8.4
    container_name: wnf-matching-mysql
    environment:
      MYSQL_DATABASE: ${MATCHING_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${MATCHING_DB_ROOT_PASSWORD}
      MYSQL_USER: ${MATCHING_DB_USERNAME}
      MYSQL_PASSWORD: ${MATCHING_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3310:3306"
    volumes:
      - matching-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  work-mysql:
    image: mysql:8.4
    container_name: wnf-work-mysql
    environment:
      MYSQL_DATABASE: ${WORK_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${WORK_DB_ROOT_PASSWORD}
      MYSQL_USER: ${WORK_DB_USERNAME}
      MYSQL_PASSWORD: ${WORK_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3311:3306"
    volumes:
      - work-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat-mysql:
    image: mysql:8.4
    container_name: wnf-chat-mysql
    environment:
      MYSQL_DATABASE: ${CHAT_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${CHAT_DB_ROOT_PASSWORD}
      MYSQL_USER: ${CHAT_DB_USERNAME}
      MYSQL_PASSWORD: ${CHAT_DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3312:3306"
    volumes:
      - chat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-redis:
    image: redis:7.4
    container_name: wnf-auth-redis
    ports:
      - "${AUTH_REDIS_PORT}:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  matching-redis:
    image: redis:7.4
    container_name: wnf-matching-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    ports:
      - "${MATCHING_REDIS_PORT}:6379"
    volumes:
      - matching-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  auth-mysql-data:
  member-mysql-data:
  job-mysql-data:
  matching-mysql-data:
  work-mysql-data:
  chat-mysql-data:
  auth-redis-data:
  matching-redis-data:
