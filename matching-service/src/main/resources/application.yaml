spring:
  application:
    name: matching-service

  datasource:
    url: ${MATCHING_DATASOURCE_URL}
    username: ${MATCHING_DATASOURCE_USERNAME}
    password: ${MATCHING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${MATCHING_JPA_DDL_AUTO:none}

  data:
    redis:
      host: ${MATCHING_REDIS_HOST:localhost}
      port: ${MATCHING_REDIS_PORT:6381}

matching:
  internal:
    secret: ${INTERNAL_API_SECRET}
  jwt:
    secret: ${AUTH_JWT_SECRET}
  member-service:
    base-url: ${MEMBER_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  job-service:
    base-url: ${JOB_SERVICE_BASE_URL:http://localhost:8083}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  payment-service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  work-service:
    base-url: ${WORK_SERVICE_BASE_URL:http://localhost:8086}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  chat-service:
    base-url: ${CHAT_SERVICE_BASE_URL:http://localhost:8087}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  confirmation:
    lease-duration: ${MATCHING_CONFIRMATION_LEASE_DURATION:2m}
  application-queue:
    recovery-interval: ${MATCHING_APPLICATION_QUEUE_RECOVERY_INTERVAL:5m}
    recovery-initial-delay: ${MATCHING_APPLICATION_QUEUE_RECOVERY_INITIAL_DELAY:30s}
  outbox-relay:
    batch-size: ${MATCHING_OUTBOX_RELAY_BATCH_SIZE:50}
    lease-duration: ${MATCHING_OUTBOX_RELAY_LEASE_DURATION:30s}
    retry-base-delay: ${MATCHING_OUTBOX_RETRY_BASE_DELAY:1s}
    retry-max-delay: ${MATCHING_OUTBOX_RETRY_MAX_DELAY:1m}
    interval: ${MATCHING_OUTBOX_RELAY_INTERVAL:1s}
    initial-delay: ${MATCHING_OUTBOX_RELAY_INITIAL_DELAY:10s}
    stream-key: ${MATCHING_OUTBOX_STREAM_KEY:matching:domain-events}

server:
  port: ${MATCHING_SERVICE_PORT:8084}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
