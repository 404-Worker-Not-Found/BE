spring:
  application:
    name: matching-service

  datasource:
    url: ${MATCHING_DATASOURCE_URL}
    username: ${MATCHING_DATASOURCE_USERNAME}
    password: ${MATCHING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${MATCHING_JPA_DDL_AUTO:none}

matching:
  jwt:
    secret: ${AUTH_JWT_SECRET}
  member-service:
    base-url: ${MEMBER_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}
  job-service:
    base-url: ${JOB_SERVICE_BASE_URL:http://localhost:8083}
    connect-timeout: 3s
    read-timeout: 5s
    internal-secret: ${INTERNAL_API_SECRET}

server:
  port: ${MATCHING_SERVICE_PORT:8084}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
