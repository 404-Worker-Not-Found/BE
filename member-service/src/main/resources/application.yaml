spring:
  application:
    name: member-service
  datasource:
    url: ${MEMBER_DATASOURCE_URL}
    username: ${MEMBER_DATASOURCE_USERNAME}
    password: ${MEMBER_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${MEMBER_JPA_DDL_AUTO:none}
  data:
    redis:
      # 근무 이벤트 Stream은 발행 서비스와 같은 matching Redis를 쓴다.
      host: ${MATCHING_REDIS_HOST:localhost}
      port: ${MATCHING_REDIS_PORT:6381}
      timeout: 2s

server:
  port: ${MEMBER_SERVICE_PORT:8082}

member:
  business-verification:
    base-url: ${NTS_BUSINESS_API_BASE_URL:https://api.odcloud.kr}
    service-key: ${NTS_BUSINESS_API_SERVICE_KEY:}
    connect-timeout: 3s
    read-timeout: 5s
  jwt:
    secret: ${AUTH_JWT_SECRET}
  internal:
    secret: ${INTERNAL_API_SECRET}
  schedule:
    # 근무 완료 시각을 해석하는 근무 일정 시간대. work-service와 같은 설정을 쓴다.
    time-zone: ${WORK_ATTENDANCE_TIME_ZONE:Asia/Seoul}
  review:
    # 근무 완료 후 리뷰를 쓸 수 있는 기간(임시 정책).
    write-period: ${MEMBER_REVIEW_WRITE_PERIOD:14d}
  trust-score:
    # 받은 평점 평균을 기본 평점 쪽으로 보정하고 노쇼를 감점하는 임시 정책(review-rating-no-show-v1).
    prior-rating: ${MEMBER_TRUST_SCORE_PRIOR_RATING:3.0}
    prior-review-count: ${MEMBER_TRUST_SCORE_PRIOR_REVIEW_COUNT:3}
    # 노쇼 1회당 신뢰 점수 감점(review-rating-no-show-v1). 결과는 0점 아래로 내려가지 않는다.
    no-show-penalty: ${MEMBER_TRUST_SCORE_NO_SHOW_PENALTY:10}
  outbox:
    # 신뢰 점수 변경 같은 회원 이벤트를 matching Redis Stream으로 발행한다.
    enabled: ${MEMBER_OUTBOX_ENABLED:true}
    stream: ${MEMBER_OUTBOX_STREAM_KEY:member:domain-events}
    batch-size: 100
    lease-duration: 30s
    retry-base-delay: 1s
    retry-max-delay: 5m
  review-events:
    # WorkCompleted로 리뷰할 수 있는 근무를 기록한다.
    enabled: ${MEMBER_REVIEW_EVENTS_ENABLED:true}
    work-stream: ${WORK_OUTBOX_STREAM_KEY:work:domain-events}
    poll-interval: ${MEMBER_REVIEW_EVENTS_POLL_INTERVAL:1s}
    initial-delay: ${MEMBER_REVIEW_EVENTS_INITIAL_DELAY:0s}
    batch-size: ${MEMBER_REVIEW_EVENTS_BATCH_SIZE:100}
  no-show-events:
    # WorkNoShow로 근로자의 노쇼를 신뢰 점수에 감점한다.
    enabled: ${MEMBER_NO_SHOW_EVENTS_ENABLED:true}
    work-stream: ${WORK_OUTBOX_STREAM_KEY:work:domain-events}
    poll-interval: ${MEMBER_NO_SHOW_EVENTS_POLL_INTERVAL:1s}
    initial-delay: ${MEMBER_NO_SHOW_EVENTS_INITIAL_DELAY:0s}
    batch-size: ${MEMBER_NO_SHOW_EVENTS_BATCH_SIZE:100}
